plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude(".cache/**") // datagen cache files
}

sourceSets {
    data {
        java.srcDir('src/data/java')
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

repositories {
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://api.modrinth.com/maven' }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// localRuntime is available to clients without becoming a published dependency.
def localRuntimeConfiguration = configurations.create('localRuntime')
def firmalifeRuntimeConfiguration = configurations.create('firmalifeRuntime')
def advancedTfcTechRuntimeConfiguration = configurations.create('advancedTfcTechRuntime')
def afcRuntimeConfiguration = configurations.create('afcRuntime')
def overdimsRuntimeConfiguration = configurations.create('overdimsRuntime')

configurations.dataImplementation.extendsFrom(configurations.implementation)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            additionalRuntimeClasspathConfiguration.extendsFrom(localRuntimeConfiguration)
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'tfie.gametest.report', project.file('build/test-results/gametest/TEST-tfie.xml').absolutePath
        }

        gameTestServerFirmalife {
            type = "gameTestServer"
            gameDirectory = project.file('run/firmalife')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'tfie.gametest.expectedMod', 'firmalife'
            systemProperty 'tfie.gametest.report', project.file('build/test-results/gametest/TEST-tfie-firmalife.xml').absolutePath
        }

        gameTestServerAdvancedTfcTech {
            type = "gameTestServer"
            gameDirectory = project.file('run/advancedtfctech')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'tfie.gametest.expectedMod', 'advancedtfctech'
            systemProperty 'tfie.gametest.report', project.file('build/test-results/gametest/TEST-tfie-advancedtfctech.xml').absolutePath
        }

        gameTestServerAfc {
            type = "gameTestServer"
            gameDirectory = project.file('run/afc')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'tfie.gametest.expectedMod', 'afc'
            systemProperty 'tfie.gametest.report', project.file('build/test-results/gametest/TEST-tfie-afc.xml').absolutePath
        }

        gameTestServerOverdims {
            type = "gameTestServer"
            gameDirectory = project.file('run/overdims')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'tfie.gametest.expectedMod', 'tfcoverdims'
            systemProperty 'tfie.gametest.report', project.file('build/test-results/gametest/TEST-tfie-overdims.xml').absolutePath
        }

        gameTestServerAll {
            type = "gameTestServer"
            gameDirectory = project.file('run/all')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'tfie.gametest.expectedMod', 'all'
            systemProperty 'tfie.gametest.report', project.file('build/test-results/gametest/TEST-tfie-all.xml').absolutePath
        }

        gameTestServerDisabledMaterials {
            type = "gameTestServer"
            gameDirectory = project.file('run/disabled-materials')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'tfie.gametest.expectedMod', 'disabled-materials'
            systemProperty 'tfie.gametest.report', project.file('build/test-results/gametest/TEST-tfie-disabled-materials.xml').absolutePath
        }

        gameTestServerRestartPrepare {
            type = "gameTestServer"
            gameDirectory = project.file('run/restart')
            jvmArgument '-XX:TieredStopAtLevel=1'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'tfie_restart'
            systemProperty 'tfie.gametest.restartPhase', 'prepare'
            systemProperty 'tfie.gametest.report', project.file('build/test-results/gametest/TEST-tfie-restart-prepare.xml').absolutePath
        }

        gameTestServerRestartVerify {
            type = "gameTestServer"
            gameDirectory = project.file('run/restart')
            jvmArgument '-XX:TieredStopAtLevel=1'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'tfie_restart'
            systemProperty 'tfie.gametest.restartPhase', 'verify'
            systemProperty 'tfie.gametest.report', project.file('build/test-results/gametest/TEST-tfie-restart.xml').absolutePath
        }

        data {
            data()
            gameDirectory = project.file('run/data')
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing-mod', 'immersiveengineering', '--existing-mod', 'tfcm'
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.data)
        }
    }
}

dependencies {
    implementation("malte0811:DualCodecs:0.1.2")
    implementation("curse.maven:terrafirmacraft-302973:9569280") { transitive = false }
    implementation("blusunrize.immersiveengineering:ImmersiveEngineering:1.21.1-12.4.2-194")
    implementation("blusunrize.immersiveengineering:ImmersiveEngineering:1.21.1-12.4.2-194:datagen")
    compileOnly("malte0811:DualCodecs:0.1.2")
    implementation("curse.maven:tfc-metallum-overhaul-1460805:9712557") { transitive = false }
    implementation("vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE")

    compileOnly("curse.maven:firmalife-453394:9399547") { transitive = false }
    compileOnly("maven.modrinth:wEKs9gH0:xzXArmox") { transitive = false }
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.64.0.455"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.64.0.455"
    localRuntime "mezz.jei:jei-1.21.1-neoforge:19.64.0.455"

    firmalifeRuntime("curse.maven:firmalife-453394:9399547") { transitive = false }
    advancedTfcTechRuntime("maven.modrinth:wEKs9gH0:xzXArmox") { transitive = false }
    afcRuntime("curse.maven:arborfirmacraft-877545:8722148") { transitive = false }
    overdimsRuntime("curse.maven:tfc-overdims-1772161:9719778") { transitive = false }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

['Firmalife': firmalifeRuntimeConfiguration, 'AdvancedTfcTech': advancedTfcTechRuntimeConfiguration,
 'Afc': afcRuntimeConfiguration, 'Overdims': overdimsRuntimeConfiguration].each { name, configuration ->
    def directory = name == 'AdvancedTfcTech' ? 'advancedtfctech' : name.toLowerCase()
    def copyMod = tasks.register("copyGameTest${name}Mod", Copy) {
        from(configuration)
        into("run/${directory}/mods")
    }
    tasks.named("runGameTestServer${name}") {
        dependsOn(copyMod)
        onlyIf { !configuration.files.empty }
    }
}

tasks.named('runGameTestServerFirmalife') { mustRunAfter 'runGameTestServer' }
tasks.named('runGameTestServerAdvancedTfcTech') { mustRunAfter 'runGameTestServerFirmalife' }
tasks.named('runGameTestServerAfc') { mustRunAfter 'runGameTestServerAdvancedTfcTech' }
tasks.named('runGameTestServerOverdims') { mustRunAfter 'runGameTestServerAfc' }
def copyAllGameTestMods = tasks.register('copyGameTestAllMods', Copy) {
    from(firmalifeRuntimeConfiguration)
    from(advancedTfcTechRuntimeConfiguration)
    from(afcRuntimeConfiguration)
    from(overdimsRuntimeConfiguration)
    into('run/all/mods')
}
tasks.named('runGameTestServerAll') {
    dependsOn(copyAllGameTestMods)
    mustRunAfter 'runGameTestServerOverdims'
    onlyIf { !afcRuntimeConfiguration.files.empty && !overdimsRuntimeConfiguration.files.empty }
}
def writeDisabledMaterialsConfig = tasks.register('writeDisabledMaterialsConfig') {
    def config = layout.projectDirectory.file('run/disabled-materials/config/tfcm-common.toml')
    outputs.file(config)
    outputs.upToDateWhen { false }
    doLast {
        config.asFile.parentFile.mkdirs()
        config.asFile.text = '''enableCustomVeinGeneration = true
disabledMetals = ["titanium"]
disabledOres = ["hematite"]
'''
    }
}
tasks.named('runGameTestServerDisabledMaterials') {
    dependsOn(writeDisabledMaterialsConfig)
    mustRunAfter 'runGameTestServerAll'
}
def clearArcRestartGameTestWorld = tasks.register('clearArcRestartGameTestWorld', Delete) {
    delete layout.projectDirectory.dir('run/restart/world')
}
tasks.named('runGameTestServerRestartPrepare') {
    dependsOn(clearArcRestartGameTestWorld)
    mustRunAfter 'runGameTestServerDisabledMaterials'
}
tasks.named('runGameTestServerRestartVerify') {
    dependsOn 'runGameTestServerRestartPrepare'
}
tasks.named('runGameTestServer') {
    finalizedBy 'runGameTestServerFirmalife', 'runGameTestServerAdvancedTfcTech',
            'runGameTestServerAfc', 'runGameTestServerOverdims', 'runGameTestServerAll',
            'runGameTestServerDisabledMaterials', 'runGameTestServerRestartVerify'
}

def copyDataCompatMods = tasks.register('copyDataCompatMods', Copy) {
    from(afcRuntimeConfiguration, overdimsRuntimeConfiguration, firmalifeRuntimeConfiguration)
    into('run/data/mods')
}
tasks.named('runData') { dependsOn(copyDataCompatMods) }

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
