modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''Connects TerraFirmaCraft materials and agriculture with Immersive Engineering machines and power.'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tfc"
type="required"
versionRange="[4.2.16,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="immersiveengineering"
type="required"
versionRange="[12.4.2-194,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tfcm"
type="required"
versionRange="[2.2.1,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="patchouli"
type="required"
versionRange="[1.21.1-93,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="firmalife"
type="optional"
versionRange="[3.0.16,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="advancedtfctech"
type="optional"
versionRange="[3.3,)"
ordering="AFTER"
side="BOTH"
